name: Check and preview lincoln-barista Hosting
on: pull_request
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/verify-process.yml
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: lincoln-barista-hosting-${{ github.sha }}
          path: .hosting-release
      - name: Check intended source-bound artifact before publication
        run: node scripts/hosting-release.mjs check .hosting-release "$GITHUB_SHA"
      - name: Copy verified artifact for Firebase CLI metadata
        run: test ! -e .hosting-deploy && cp -R .hosting-release .hosting-deploy
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: hosting
        with:
          entryPoint: .hosting-deploy
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ESPRESSO_4298D }}
          projectId: espresso-4298d
      - name: Verify every intended served asset and canonical root
        env:
          PREVIEW_URL: ${{ steps.hosting.outputs.details_url }}
        run: node scripts/hosting-release.mjs verify-url .hosting-release "$GITHUB_SHA" "$PREVIEW_URL"
