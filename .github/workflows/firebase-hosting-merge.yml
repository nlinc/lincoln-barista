name: Check and publish lincoln-barista Hosting
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify-process.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: lincoln-barista-hosting-${{ github.sha }}
          path: .hosting-release
      - name: Check intended source-bound artifact before publication
        run: node scripts/hosting-release.mjs check .hosting-release "$GITHUB_SHA"
      - name: Copy verified artifact for Firebase CLI metadata
        run: test ! -e .hosting-deploy && cp -R .hosting-release .hosting-deploy
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ESPRESSO_4298D }}
          project_id: espresso-4298d
      - name: Preserve the existing Firestore and Storage rule deployment surface
        run: npx --yes firebase-tools@15.22.1 deploy --project espresso-4298d --only firestore:rules,storage --non-interactive
      - name: Publish exactly the checked Hosting artifact
        run: npx --yes firebase-tools@15.22.1 deploy --config .hosting-deploy/firebase.json --project espresso-4298d --only hosting --non-interactive
      - name: Verify every intended served asset and canonical root
        run: node scripts/hosting-release.mjs verify-url .hosting-release "$GITHUB_SHA" https://espresso-4298d.web.app/
