name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Functions Dependencies
        run: npm --prefix functions install

      - name: Stamp build commit
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s/__BUILD_COMMIT__/${SHORT_SHA}/g" public/index.html public/sw.js
        
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,functions,firestore:rules --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ESPRESSO_4298D }}
